<div class="body">
    <div class="sign-up">
        <div class="steps">
            <button class="step passed">1</button>
            <div class="line">-</div>
            <button class="step active">2</button>
            <div class="line">-</div>
            <button class="step">3</button>
        </div>

        <div class="box">
            <div class="title">
                <h2>Create your account</h2>
                <p>Join thousands of citizens improving Algeria's infrastructure.</p>
            </div>

            <div class="inputs">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="email" placeholder="example@gmail.com">

                <label for="password">Password</label>
                <input type="password" id="password" class="password" placeholder="............">

                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" class="confirm-password" placeholder="............">
            </div>

            <div class="btns">
                <button class="btn">Verify</button>
            </div>
        </div>

        <div class="privacy">
            <img src="" alt="">
            <p>Secure &amp; Private: Your data is encrypted and no one can access it.</p>
        </div>
    </div>
</div>
