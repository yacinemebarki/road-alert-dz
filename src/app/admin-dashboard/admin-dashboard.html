<div class="body">
    <header>
        <h1>admin Dashboard</h1>
        <div class="search">
            <input class="search-input" id="search-input" type="text" placeholder="enter title">
        </div>
    </header>   
    <div class="filter">
        <div class="text">
            <h2>Infrastructure Management Overview</h2>
            <p>Monitor and manage national road hazard reports.</p>
        </div>
        <app-alert-filter></app-alert-filter>       
    </div>
    <div class="recent-post">
        <h1>Recent alert</h1>
        <table>
            <thead>
                <tr>
                    <th>Report Id</th>
                    <th>Report title</th>
                    <th>Wilaya</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let report of reports">
                    <td>{{ report.id }}</td>
                    <td>{{ report.title }}</td>
                    <td>{{ report.wilaya }}</td>
                    <td>{{ report.status }}</td>
                    <td>{{ report.action }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
