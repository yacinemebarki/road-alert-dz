<div class="body">
    <header>
        <div class="identity">
            <img src="">
            <h2>Alert Road Dz</h2>
        </div>
        <div class="title">
            <h2>Community Feed</h2>
        </div>
    </header>
    <div class="container">
        <div class="intro">
            <h1>Create a Report</h1>
            <p>Help improve our infrastructure by reporting a road hazard or issue in your community.</p>
        </div>
        <div class="inputs">
            <div class="image-input">
                <div id="drop-zone">
                    <i class="bi bi-plus-square-dotted"></i>
                    Drag & Drop an image here
                    <br>
                    or
                    <br>
                    <input type="file" id="image-input" accept="image/*">
                </div>
            </div>
            <div class="title-input">
                <label for="title">title: </label>
                <input type="text" class="title" id="title" placeholder="enter title">
            </div>
            <div class="description-input">
                <label for="description">discription: </label>
                <textarea id="description" class="discription" placeholder="enter discription"></textarea>
            </div>
            <div class="location-input">
                <label for="location">location: </label>
                <input type="text" id="location" class="location" placeholder="enter cordinate link">
            </div>
        </div>
        <div class="btn">
            <button class="report" id="report">Submit Report</button>
            <button class="cancel" id="cancel">cancel</button>
        </div>
    </div>    
</div>
