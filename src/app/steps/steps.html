<div class="steps">

    <button class="step"
        [class.active]="current_step === 1"
        [class.passed]="current_step > 1">
        1
    </button>

    <div class="line">-</div>

    <button class="step"
        [class.active]="current_step === 2">
        2
    </button>

    <div class="step-title">
        <h4>
            {{ current_step === 1 ? 'Personal Details' : 'Email Verification' }}
        </h4>
    </div>

</div>
