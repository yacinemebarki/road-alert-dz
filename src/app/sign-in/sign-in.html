<div class="sign-in">
    <div class="title">
        <h2>sign in</h2>
    </div>
    <div class="inputs">
        <div class="input-email">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="email" placeholder="example@gmail.com">
        </div>  
        <div class="input-password">
            <div class="password-label">
                <label for="password">Password</label>
                <a routerLink="/forget-password">Forgot Password?</a>
            </div>
            <input type="password" id="password" class="password" placeholder="example">
        </div>
    </div>
    <button class="sign-btn">Continue to a Dashboard</button>
</div>
