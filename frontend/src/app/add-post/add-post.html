<div class="body">
    <header>
        <div class="identity">
            <img src="">
            <h2>Alert Road Dz</h2>
        </div>
        <div class="title">
            <h2>Community Feed</h2>
        </div>
    </header>
    <div class="container">
        <div class="intro">
            <h1>Create a Report</h1>
            <p>Help improve our infrastructure by reporting a road hazard or issue in your community.</p>
        </div>
        <div class="inputs">
            <div class="image-input">
                <label for="drop-zone">Photo Evidence (Required)</label>
                <div class="drop-zone" id="drop-zone">
                    <i class="bi bi-image"></i>
                    <p><span class="upload-link" id="upload-link">Upload a file</span> or drag and drop</p>
                    <p class="file-info">PNG, JPG, GIF up to 10MB</p>
                    <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif" hidden>
                </div>
            </div>
            <div class="title-input">
                <label for="title-iput">title: </label>
                <input type="text" [(ngModel)]="title" class="title-iput" id="title-input" placeholder="enter title">
            </div>
            <div class="description-input">
                <label for="description">discription: </label>
                <textarea id="description" [(ngModel)]="description" class="discription" placeholder="enter discription"></textarea>
            </div>
            <div class="location-input">
                <label for="location">location: </label>
                <input type="text" [(ngModel)]="location" id="location" class="location" placeholder="enter cordinate link">
            </div>
            <div class="btn">
                <button class="report" (click)="report()" id="report">Submit Report</button>
                <button class="cancel" (click)="cancel()" id="cancel">cancel</button>
            </div>
        </div>
        
    </div>    
</div>
