<div class="body">
    <div class="sign-up">
        <app-steps [current_step]="current_step"></app-steps>
        @if(current_step == 1){
            <app-sign-up-inputs (UpBtn)="next_step($event)"></app-sign-up-inputs>
        }
        @if(current_step == 2){
            <app-verfication [email]="email"></app-verfication>
        }
        <app-privacy-message></app-privacy-message>
    </div>
</div>
