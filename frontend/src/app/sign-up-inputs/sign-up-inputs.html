<div class="box">
    <div class="title">
        <h2>Create your account</h2>
        <p>Join thousands of citizens improving Algeria's infrastructure.</p>
    </div>

    <div class="inputs">
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" [(ngModel)]="email" id="email" class="email" placeholder="example@gmail.com">
        </div>

        <div class="input-group">
            <label for="user-name">Confirm Password</label>
            <input type="text" [(ngModel)]="user_name" id="user-name" class="user-name" placeholder="enter use name">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" [(ngModel)]="password" id="password" class="password" placeholder="............">
        </div>

        <div class="input-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" [(ngModel)]="confirm_password" id="confirm" class="confirm-password" placeholder="............">
        </div>
    </div>

    <div class="btns">
        <button class="btn" (click)="onVerify()">Verify</button>
    </div>
</div>
