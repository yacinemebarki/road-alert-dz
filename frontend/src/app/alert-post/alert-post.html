<div class="post" *ngIf="post">
    <div class="head">
        <div class="pfp">
            <div class="user-info">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80"
                    id="profile" class="profile">
                <div class="publicher-info">
                    <div class="user-name">
                        <h5>Road Alert Community</h5>
                    </div>
                    <div class="time">{{ displayTime }}</div>
                </div>
            </div>
        </div>
        <div class="settings">
            <button class="setting" id="setting">...</button>
        </div>
    </div>
    <div class="post-info">
        <div class="post-title">
            <h1>{{ post.title }}</h1>
            <div class="location">
                <i class="bi bi-geo-alt"></i>
                <a [href]="'https://maps.google.com/?q=' + post.location" class="location-link" target="_blank"
                    rel="noreferrer">{{ post.location }}</a>
            </div>
        </div>
        <div class="status">
            <button class="status-btn" id="status-btn">{{ post.status }}</button>
        </div>
        <div class="post-description">{{ post.description }}</div>
    </div>
    <div class="post-img">
        <img [src]="imageUrl" id="img" class="img" alt="{{ post.title }}">
    </div>
    <div class="reaction">
        <div class="like">
            <i class="bi bi-hand-thumbs-up"></i>
            <div class="number-like">24 Upvotes</div>
        </div>
        <div class="share">
            <i class="bi bi-share"></i>
            <p>Share</p>
        </div>
    </div>
</div>
